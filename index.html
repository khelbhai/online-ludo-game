<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Ludo Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Login/Join Screen -->
        <div id="loginScreen" class="screen active">
            <div class="login-box">
                <h1>🎲 Online Ludo</h1>
                <div class="form-group">
                    <label for="playerName">Player Name:</label>
                    <input type="text" id="playerName" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label for="roomCode">Room Code:</label>
                    <input type="text" id="roomCode" placeholder="Enter or leave empty for new room" maxlength="6">
                </div>
                <div class="form-group">
                    <label for="betAmount">Bet Amount ($):</label>
                    <input type="number" id="betAmount" placeholder="Enter bet amount" min="0" max="1000" value="10">
                </div>
                <button id="joinBtn" class="btn btn-primary">Join Game</button>
                <button id="createRoomBtn" class="btn btn-secondary">Create New Room</button>
            </div>
        </div>

        <!-- Game Lobby Screen -->
        <div id="lobbyScreen" class="screen">
            <div class="lobby-container">
                <h2>Game Lobby</h2>
                <div class="room-info">
                    <p><strong>Room Code:</strong> <span id="displayRoomCode" class="code-badge">LOADING</span></p>
                    <button id="copyCodeBtn" class="btn btn-sm">📋 Copy Code</button>
                </div>
                
                <div class="bet-info">
                    <p><strong>Bet Amount:</strong> $<span id="displayBetAmount">0</span></p>
                </div>

                <div class="players-section">
                    <h3>Players in Room (<span id="playerCount">0</span>/4)</h3>
                    <div id="playersList" class="players-list"></div>
                </div>

                <div class="game-status">
                    <p id="statusMessage">Waiting for players...</p>
                </div>

                <button id="startGameBtn" class="btn btn-primary" disabled>Start Game</button>
                <button id="leaveLobbyBtn" class="btn btn-secondary">Leave Room</button>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" class="screen">
            <div class="game-header">
                <h2>🎲 Ludo Game</h2>
                <div class="game-info">
                    <p><strong>Room:</strong> <span id="gameRoomCode">LOADING</span></p>
                    <p><strong>Bet:</strong> $<span id="gameBetAmount">0</span></p>
                    <p><strong>Current Turn:</strong> <span id="currentTurn">Player 1</span></p>
                </div>
            </div>

            <div class="game-board">
                <div class="board-container">
                    <svg id="ludoBoardSVG" width="500" height="500" viewBox="0 0 500 500"></svg>
                </div>
                
                <div class="game-controls">
                    <div class="dice-section">
                        <button id="rollDiceBtn" class="btn btn-primary btn-large">🎲 Roll Dice</button>
                        <p id="diceResult">Dice: -</p>
                    </div>

                    <div class="game-stats">
                        <h3>Game Status</h3>
                        <div id="gameStatusDisplay" class="status-display"></div>
                    </div>

                    <div class="player-pieces">
                        <h3>Your Pieces</h3>
                        <div id="playerPiecesDisplay" class="pieces-display"></div>
                    </div>
                </div>
            </div>

            <div class="game-actions">
                <button id="pauseGameBtn" class="btn btn-secondary">Pause</button>
                <button id="endGameBtn" class="btn btn-danger">End Game</button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="screen">
            <div class="game-over-box">
                <h1 id="gameOverTitle">Game Over!</h1>
                <div class="results-container">
                    <div id="resultsList" class="results-list"></div>
                </div>
                <div class="winnings">
                    <p><strong>Your Winnings:</strong> <span id="winningsAmount" class="amount">$0</span></p>
                </div>
                <button id="playAgainBtn" class="btn btn-primary">Play Again</button>
                <button id="exitBtn" class="btn btn-secondary">Exit</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
